name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs the full history to attribute new code correctly.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit + integration tests (Testcontainers/PostgreSQL) and the JaCoCo
      # gate (>= 80% instruction coverage).
      - name: mvn verify
        run: mvn -B verify

      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        run: mvn -B sonar:sonar -Dsonar.qualitygate.wait=true

      - name: SonarQube Cloud analysis skipped
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not set, the SonarQube Cloud analysis and quality gate did not run."

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  build-and-push-image:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            adrianameyer/workshop-inventory-service:latest
            adrianameyer/workshop-inventory-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

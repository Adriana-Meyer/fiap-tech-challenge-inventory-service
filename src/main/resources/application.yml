spring:
  application:
    name: workshop-inventory-service

  autoconfigure:
    # Authentication is purely token based (see JwtAuthenticationFilter); there
    # is no user store, so Boot must not generate a default in-memory user.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: inventory
    password: inventory123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Same HS256 secret as the OS service, which issues the tokens.
    secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-64-characters-long-for-hs512-ok}

  messaging:
    # Off in tests that do not exercise the queues: the listener connects to SQS when the app starts.
    enabled: ${MESSAGING_ENABLED:true}
    commands-queue: ${COMMANDS_QUEUE:inventory-commands}
    # ARN of the saga-events topic (os-infrastructure); the answers to the OS service go there.
    events-topic-arn: ${EVENTS_TOPIC_ARN:}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.fiap.workshop: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
